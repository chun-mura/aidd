http_port 3128
visible_hostname aidd-egress-proxy
httpd_suppress_version_string on
pid_filename none
pinger_enable off
via off
forwarded_for delete
cache deny all
cache_mem 0 MB
cache_store_log none
digest_generation off
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

acl SSL_ports port 443
acl CONNECT method CONNECT
acl manager proto cache_object
# CONNECT authority must be <hostname>:443. This rejects bracketed IPv6,
# ports other than 443 and any character that is not a hostname character.
acl connect_authority url_regex -i ^[a-z0-9.-]+:443$
# Last label all digits or 0x-hex: IPv4 in dotted, decimal, hex or octal
# form. Checked on the string, so no reverse DNS lookup is triggered.
acl ip_literal_host url_regex -i (^|\.)(0x[0-9a-f]*|[0-9]+)\.?:443$
# Resolved destinations that must never be reached through the proxy:
# loopback, private, link-local (including cloud metadata), CGNAT, reserved,
# IPv4-mapped IPv6, IPv6 ULA and link-local. Checked after name resolution,
# so a name that resolves into these ranges is refused (DNS rebinding).
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl private_dst dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16
acl private_dst dst 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl private_dst dst ::/128 ::1/128 ::ffff:0:0/96 fc00::/7 fe80::/10
acl allowed_dst dstdomain -n .example.com

http_access deny manager
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !connect_authority
http_access deny ip_literal_host
http_access deny private_dst
http_access allow allowed_dst
http_access deny all
